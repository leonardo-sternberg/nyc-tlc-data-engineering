models:
  - name: dim_date
    description: One row per calendar day, 2024-01-01 to 2025-12-31 (731 rows). Joined to fct_trips on the pickup date.
    columns:
      - name: date_day
        description: Calendar date, primary key.
        data_tests:
          - unique
          - not_null
      - name: year
        description: Calendar year (2024, 2025).
      - name: quarter
        description: Quarter of the year (1 to 4).
      - name: month
        description: Month number (1 to 12).
      - name: month_name
        description: Month name in English (January ... December).
      - name: day_of_month
        description: Day of the month (1 to 31).
      - name: day_of_week
        description: Day of the week as returned by BigQuery, 1 = Sunday to 7 = Saturday.
      - name: day_name
        description: Day name in English (Monday ... Sunday).
      - name: week_of_year
        description: Week of the year, weeks start on Sunday. Days before the first Sunday are week 0 (0 to 53).
      - name: is_weekend
        description: True on Saturday and Sunday.
      - name: year_month
        description: Year and month as text (e.g. 2025-03), handy for chart axes and sorting.